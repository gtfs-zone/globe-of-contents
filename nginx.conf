gzip on;
gzip_types text/html text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Serve the .gz files CI generates next to each asset instead of compressing on
# every request.
gzip_static on;

# Caches must key on Accept-Encoding once the same URL can answer gzipped or not.
gzip_vary on;

# Installed as an envsubst template (see Dockerfile): ${PAGES_UPSTREAM} and
# ${NGINX_LOCAL_RESOLVERS} are filled in at container start. nginx's own
# variables are left alone because envsubst only replaces defined env vars.

# Feed page fragments from geometry-car, cached so a Garage blip still serves
# the last copy.
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:1m max_size=64m inactive=7d use_temp_path=off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolved per request, so nginx starts even when the upstream does not
    # resolve yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $pages_upstream "${PAGES_UPSTREAM}";

    # Probe target: cheaper than serving index.html on every readiness check, and
    # it answers even if the app bundle is broken.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Long cache for fingerprinted/versioned static assets.
    # `json` is in this list, and a year-long immutable cache is wrong for data
    # that refreshes daily. It is harmless only because the catalogue is
    # fetched from data.gtfs.zone, never from this origin: do not move the
    # artifacts into public/.
    # add_header does not inherit into a location that sets its own headers, so
    # the security headers are repeated in each block.
    location ~* \.(css|js|woff2|woff|ttf|webp|png|jpg|jpeg|gif|ico|svg|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # index.html must never be cached: it names the fingerprinted assets, so a
    # stale copy pins the browser to a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # A feed page: the app shell with the feed's head and body fragments
    # included (see the SSI directives in src/index.html). Unknown ids fall
    # back to the home head through the include's stub.
    location ~ "^/feed/(?<fid>f-[0-9a-f]{10})(/[^/]*)?/?$" {
        # SSI cannot rewrite a precompressed body.
        gzip_static off;
        ssi on;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # SSI subrequests only: /_page/<id>/head.html to the bucket's
    # pages/feed/<id>/head.html. Garage picks the bucket from the Host header.
    location ^~ /_page/ {
        internal;
        rewrite ^/_page/(.*)$ /pages/feed/$1 break;
        proxy_pass $pages_upstream;
        proxy_set_header Host data.gtfs.zone;
        # SSI includes the body as-is, so it must arrive uncompressed.
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name data.gtfs.zone;
        proxy_cache pages;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # An error page would be included verbatim; an empty body makes SSI
        # use the include's stub instead.
        proxy_intercept_errors on;
        error_page 403 404 500 502 503 504 = @no_fragment;
    }

    location @no_fragment {
        return 204;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap.xml break;
        proxy_pass $pages_upstream;
        proxy_set_header Host data.gtfs.zone;
        proxy_ssl_server_name on;
        proxy_ssl_name data.gtfs.zone;
        proxy_cache pages;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
